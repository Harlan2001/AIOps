[project]
name = "ai-ops"
version = "0.1.0"
description = "数据库业务报错智能诊断系统：规则引擎查库取证 + Dimple 知识库 + LLM 长尾兜底（私有化 Web 工作台）"
readme = "README.md"
authors = [
    { name = "HARLAN XU", email = "xuziliang9@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "py-opengauss>=1.3.11",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# P1 服务化才安装（FastAPI 薄封装内核；未装 api extra 时 HTTP 相关模块不可用）
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2", "apscheduler>=3.10"]
# P1 演示前端（Streamlit；pandas 为 demo 直接 import，显式声明不靠传递依赖）
demo = ["streamlit>=1.30", "pandas>=2"]

[dependency-groups]
dev = [
    # tests/unit/test_api.py 经 fastapi.TestClient 导入 ai_ops.api；无 extra 的
    # 核心环境（uv sync 后直接 pytest）也必须能收集，故测试所需的 fastapi/pydantic
    # 归入 dev 组；uvicorn 仅运行服务时需要，仍留在 api extra。
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pytest>=8",
]

[project.scripts]
ai-ops = "ai_ops.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

# 索引策略（N1）：不在仓库内锁死区域镜像，uv 默认使用 PyPI，lock 可移植。
#   国内开发：uv sync --default-index https://mirrors.aliyun.com/pypi/simple/
#             或设环境变量 $env:UV_DEFAULT_INDEX="https://mirrors.aliyun.com/pypi/simple/"
#   离线交付：uv pip install --no-index --find-links <wheelhouse 目录>

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
