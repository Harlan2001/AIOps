[project]
name = "ai-ops"
version = "0.1.0"
description = "数据库业务报错智能诊断系统：规则引擎查库取证 + Dimple 知识库 + LLM 长尾兜底（私有化 Web 工作台）"
readme = "README.md"
authors = [
    { name = "HARLAN XU", email = "xuziliang9@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "py-opengauss>=1.3.11",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# P1 服务化才安装（FastAPI 薄封装内核 + MySQL 业务库）；未装时 ai-ops api 子命令延迟报错
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2", "pymysql>=1.1"]
# P1 演示前端（Streamlit）
demo = ["streamlit>=1.30"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[project.scripts]
ai-ops = "ai_ops.cli:main"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
