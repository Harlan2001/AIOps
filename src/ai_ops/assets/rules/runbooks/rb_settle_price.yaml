# 诊断树：结算价不存在（GaussDB 版）
id: rb_settle_price
title: 结算价不存在
steps:
  - id: is_trade_date
    type: sql_check
    title: 交易日检查
    expect: {exists: true}
    sql: "SELECT trade_date, note FROM dimple.tp_exch_trade_date WHERE trade_date = :trade_date"
    on_fail:
      root: "当日（{trade_date}）不在交易日历，或交易日历/节假日尚未配置"
      action:
        - "检查交易日历 dimple.tp_exch_trade_date 与节假日是否已维护到该日期"
        - "确认为何非交易日触发了结算（可能是节假日未设置）"

  - id: price_latest
    type: sql_query
    title: 结算价表最新数据日期（旁证，判断数据是否已推进到报错日）
    sql: "SELECT MAX(trade_date) AS latest_date FROM dimple.tc_clear_price"

  - id: price_exists
    type: sql_check
    title: 结算价记录检查
    primary: true
    expect: {exists: true}
    sql: "SELECT trade_date, contract_id, clear_price, if_manual, remark FROM dimple.tc_clear_price WHERE trade_date = :trade_date AND contract_id = :contract"
    on_fail:
      root: "结算价缺失：{contract} 在 {trade_date} 的结算价尚未生成（闭市后处理未执行/失败，或当日行情缺失）"
      action:
        - "在【结算价管理】中手工补录该合约当日结算价"
        - "检查闭市后结算任务是否已成功执行"
        - "确认该合约当日是否有行情；补录或重跑成功后重新执行结算"

default:
  root: "{contract} 当日结算价已存在但仍报错，可能为结算流程内部状态异常"
  action:
    - "结合调用链位置（lsection）定位报错代码/存储过程"
    - "检查是否重复结算或缓存了旧状态"
