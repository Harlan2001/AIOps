# 诊断树：掉期远端敞口报警（rule_alarm 约 5.9 万条）
# 报错形如：远端 PAu 合约空头净敞口 < 实时库存 / iPAu 远端敞口不足
# 业务含义：掉期（swap）远端合约的空头净敞口应 ≥ 实时库存（用于交割备付），
#           当空头净敞口低于实时库存时，表示远端空头不足以覆盖库存，存在敞口风险。
# 数据现状：tc_swap_far_exposure / tc_real_inventory 在 GaussDB 清单中不存在；
#           远端敞口 vs 实时库存的统计库内无对应表，改用掉期成交明细
#           tc_swap_match_detail 作业务规模旁证，敞口缺口判定需业务侧数据。
id: rb_swap_exposure_alert
title: 掉期远端敞口报警
steps:
  - id: swap_matches
    type: sql_query
    title: 掉期成交明细（旁证，看该会员掉期业务规模）
    sql: "SELECT clear_date, member_id, contract_id, bs_flag, qty, amt FROM dimple.tc_swap_match_detail WHERE member_id = :member AND contract_id = :contract ORDER BY clear_date DESC LIMIT 10"

  - id: swap_short_exposure
    type: sql_check
    title: 掉期业务数据检查
    primary: true
    expect: {exists: true}
    sql: "SELECT clear_date, member_id, contract_id, bs_flag, qty FROM dimple.tc_swap_match_detail WHERE member_id = :member AND contract_id = :contract"
    on_fail:
      root: "未找到该会员在掉期合约上的成交/持仓记录：掉期合约未成交或敞口计算任务未执行"
      action:
        - "检查该掉期合约是否已在系统中正确录入"
        - "检查闭市后敞口计算任务是否成功执行"

default:
  root: "掉期远端敞口报警：会员 {member} 远端合约 {contract} 的空头净敞口低于实时库存，存在实物交割备付不足的风险。需补足远端空头头寸或调整库存"
  action:
    - "核对实时库存量与远端空头净敞口的具体差值"
    - "如库存增加（新入库），需在远端合约上增加空头头寸以匹配库存"
    - "如库存未变但空头减少（被平仓），检查是否有误操作平掉了远端对冲头寸"
    - "短期方案：在远端合约上开空头寸补齐敞口；长期方案：建立库存-敞口自动匹配机制"