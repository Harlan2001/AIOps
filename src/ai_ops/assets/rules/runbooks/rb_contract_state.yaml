# 诊断树：合约状态错误（GaussDB 新增，quote_err 高频 14,717 条，覆盖率 97.3% 的关键 runbook）
# 报错形如：合约状态错误 / 合约未上市 / 合约已退市 / 合约暂停交易 / 合约不存在
# 业务含义：报价/委托的目标合约当前状态不允许交易（未上市、已退市、暂停交易、到期摘牌等）。
# 数据路径：合约主表 tt_ftr_contract（status）→ 合约状态控制表 tt_contract_state_ctrl → 合约交易日历 tp_contract_trade_date。
id: rb_contract_state
title: 合约状态错误
steps:
  - id: is_trade_date
    type: sql_check
    title: 交易日检查
    expect: {exists: true}
    sql: "SELECT trade_date, note FROM dimple.tp_exch_trade_date WHERE trade_date = :trade_date"
    on_fail:
      root: "当日（{trade_date}）不在交易日历，或交易日历/节假日尚未配置"
      action:
        - "检查交易日历与节假日是否已维护到该日期"

  - id: contract_exist
    type: sql_check
    title: 合约是否存在
    primary: true
    expect: {exists: true}
    # tt_ftr_contract 状态列为 status（字典104），无 contract_status/list_date/expire_date 列
    sql: "SELECT contract_id, contract_name, variety_id, exch_code, status, start_trade_date, end_trade_date FROM dimple.tt_ftr_contract WHERE contract_id = :contract"
    on_fail:
      root: "合约 {contract} 在期货合约主表（tt_ftr_contract）中不存在：合约代码输入错误，或该合约尚未在系统中创建"
      action:
        - "检查合约代码拼写是否正确（注意大小写、空格、特殊字符）"
        - "确认该合约是否已在【合约管理】中完成录入与上市流程"
        - "若为新上市合约，联系数据管理岗完成合约信息录入"

  - id: contract_state
    type: sql_query
    title: 合约状态详情（旁证，看具体状态码与生效时间）
    sql: "SELECT contract_id, start_time, state FROM dimple.tt_contract_state_ctrl WHERE contract_id = :contract ORDER BY start_time DESC"

  - id: contract_trade_cal
    type: sql_query
    title: 合约交易日历（旁证，确认该合约当日是否可交易）
    sql: "SELECT contract_id, trade_date FROM dimple.tp_contract_trade_date WHERE contract_id = :contract AND trade_date = :trade_date"

default:
  root: "合约 {contract} 状态异常：合约在系统中存在但当前状态不允许交易（可能已退市/摘牌、暂停交易、未到上市日、或已过最后交易日）"
  action:
    - "在【合约状态控制】中核对该合约的当前状态（是否挂牌/退市/暂停）及生效时间"
    - "对照合约最后交易日与到期日，确认合约是否已进入交割/摘牌阶段"
    - "若为正常合约误判，检查合约状态控制表中是否有异常生效的暂停记录"
    - "若合约确已不可交易，改用替代合约（如主力合约切换）后重新报价"