# 诊断树：平仓时持仓不足（GaussDB 版）
# 表已从 Oracle CLEAR. 迁移为 dimple. 小写表名（tc_ftr_client_posi_clear / tc_clear_posi_detail）。
id: rb_position
title: 平仓时持仓不足

# 诊断日期取成交编号前 8 位（成交业务日期）
date_from: {field: "match_no", regex: "^([0-9]{8})"}
# 从原始文本额外抽取买卖方向
extra_params:
  bs_dir: {regex: "\\[([买卖])\\]"}

steps:
  - id: posi_latest
    type: sql_query
    title: 客户持仓表最新结算日（旁证）
    sql: "SELECT MAX(clear_date) AS latest_date FROM dimple.tc_ftr_client_posi_clear"

  - id: client_posi
    type: sql_check
    title: 客户该合约当日持仓
    primary: true
    expect: {exists: true}
    sql: "SELECT clear_date, client_id, member_id, contract_id, sh_flag, buy_qty, sell_qty FROM dimple.tc_ftr_client_posi_clear WHERE clear_date=:trade_date AND member_id=:member AND client_id=:client AND contract_id=:contract"
    on_fail:
      root: "客户持仓表无该会员/客户/合约的当日持仓记录（持仓未初始化或已全部平掉）"
      action:
        - "核对该客户该合约当日结算持仓是否已生成"
        - "检查是否重复提交平仓、合约代码或买卖方向错误"

  - id: detail_posi
    type: sql_query
    title: 持仓明细（按席位/交易员/买卖方向）
    sql: "SELECT trade_date, member_id, client_id, trader_no, bs_flag, SUM(qty) AS qty FROM dimple.tc_clear_posi_detail WHERE trade_date=:trade_date AND member_id=:member AND client_id=:client AND contract_id=:contract GROUP BY trade_date, member_id, client_id, trader_no, bs_flag ORDER BY trader_no, bs_flag"

default:
  root: "{bs_dir}方向持仓不足：{contract} 平仓量超过可平量，报错尚缺 {lack} 手（会员 {member} / 客户 {client} / 交易员 {trader} / 成交 {match_no}）"
  action:
    - "对照上方查询到的实际持仓量，核对该客户该合约{bs_dir}方向的可平量"
    - "检查是否重复平仓、买卖方向选反，或当日已有同方向平仓占用可平量"
    - "按可平量调减平仓数量后重新提交；注意可平量基数为当日结算后持仓量"
