# 诊断树：递延费率不存在（GaussDB 版）
id: rb_defer_fee
title: 递延费率不存在
steps:
  - id: is_trade_date
    type: sql_check
    title: 交易日检查
    expect: {exists: true}
    sql: "SELECT trade_date, note FROM dimple.tp_exch_trade_date WHERE trade_date = :trade_date"
    on_fail:
      root: "当日（{trade_date}）不在交易日历，或交易日历/节假日尚未配置"
      action:
        - "检查交易日历与节假日表是否已维护到该日期"
        - "确认为何非交易日触发了结算"

  - id: fee_latest
    type: sql_query
    title: 递延费率表最新数据日期（旁证）
    sql: "SELECT MAX(trade_date) AS latest_date FROM dimple.tc_defer_fee_rate"

  - id: fee_exists
    type: sql_check
    title: 递延费率记录检查
    primary: true
    expect: {exists: true}
    sql: "SELECT trade_date, member_id, client_id, contract_id, pay_flag, defer_fee FROM dimple.tc_defer_fee_rate WHERE trade_date = :trade_date AND member_id = :member AND contract_id = :contract"
    on_fail:
      root: "递延费率缺失：会员 {member} 的 {contract} 在 {trade_date} 递延补偿费率尚未生成（费率参数未配置或闭市后处理未跑）"
      action:
        - "检查该合约的递延费率参数（保证金/费率参数管理）是否已配置"
        - "检查闭市后结算/费率生成任务是否成功执行"
        - "补录费率或重跑结算后重新执行"

  - id: delivery_fee
    type: sql_query
    title: 交割手续费配置（旁证，判断费率参数是否维护）
    sql: "SELECT member_id, contract_id, variety_id, exch_code, fee_type, delivery_fee FROM dimple.tc_delivery_fee WHERE member_id = :member AND contract_id = :contract"

default:
  root: "会员 {member} 的 {contract} 当日递延费率已存在但仍报错，可能为结算流程内部状态异常"
  action:
    - "结合调用链位置（lsection）检查结算/费率生成后续步骤"
