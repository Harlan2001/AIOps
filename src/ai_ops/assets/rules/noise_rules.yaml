# 噪音过滤规则：定时任务产生的"成功/无数据/完成"流水（被误记成 ERROR）
# 判定优先级：业务报错词（不存在/失败/异常/错误/未/不允许...）优先于本清单；
# 命中报错词的（如"未完成""清算未完成"）仍按业务报错处理。
# 基于历史 data/noise_seed.csv（16 种噪音模式，约 8.3 万条）提炼。
noise_contains:
  - "无需要发送"
  - "处理成功"
  - "查询成功"
  - "新增成功"
  - "导表成功"
  - "成功"
  - "处理完成"
  - "检查完成"
  - "整理完成"
  - "成功启动"
  - "已经恢复"
  - "已恢复"
  - "已处理"
