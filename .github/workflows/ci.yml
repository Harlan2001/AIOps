name: CI

# 对所有 PR 与 main 推送生效；同分支新推送取消旧运行，省额度。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # 核心环境：只装运行时依赖（py-opengauss + pyyaml），不应依赖任何 extra
          - name: core-no-extras
            sync-args: ""
            coverage-args: ""
          # 服务化环境：装 api extra（fastapi/uvicorn/pydantic/pymysql）
          # 同时产出覆盖率，避免为质量报告重复执行整套测试。
          - name: api-extra
            sync-args: "--extra api"
            coverage-args: "--cov=src/ai_ops --cov-report=term-missing --cov-report=xml"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked ${{ matrix.sync-args }}

      - name: Run pytest
        run: uv run --no-sync pytest ${{ matrix.coverage-args }}

      - name: Upload backend coverage
        if: matrix.name == 'api-extra'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  quality-backend:
    name: quality-backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run --no-sync ruff check .

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      # build 已包含 vue-tsc --noEmit，不重复执行类型检查。
      - name: Build production assets
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error
          retention-days: 7

  wheel-build-smoke:
    name: wheel-build-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel

      # 全新空 venv 只装该 wheel（带核心依赖），验证打包完整性：
      # 资源 YAML 是否进包、核心依赖是否齐全、导入链是否可用。
      # 用 -I 隔离模式，确保 import 走已安装 wheel 而非仓库源码目录。
      - name: Smoke install in clean venv
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -I -c "from ai_ops.engine.rule_engine import Engine; from ai_ops.rules_store import load_runbook; import ai_ops.cli; e=Engine(); load_runbook('rb_settle_price'); print('types=%d noise=%d' % (len(e.types), len(e.noise_kw)))"
